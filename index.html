<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus Cycle</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Focus Cycle">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5f8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --bg:#f4f5f8;--panel:#fff;--ink:#1b2231;--mute:#667085;--line:#e3e6ee;
  --a:#4f46e5;--a-soft:#e9e8fc;--b:#16976a;--b-soft:#dcf3ea;--warn:#b54708;--warn-soft:#fef0c7;--bad:#d92d20;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141c;--panel:#1b1f2b;--ink:#eef0f6;--mute:#9aa3b5;--line:#2b3040;
  --a:#8b86ff;--a-soft:#26254a;--b:#43c897;--b-soft:#15382d;--warn:#fdb022;--warn-soft:#3a2b0a;--bad:#f97066;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--panel:#1b1f2b;--ink:#eef0f6;--mute:#9aa3b5;--line:#2b3040;
  --a:#8b86ff;--a-soft:#26254a;--b:#43c897;--b-soft:#15382d;--warn:#fdb022;--warn-soft:#3a2b0a;--bad:#f97066;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
main{max-width:620px;margin:0 auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:22px}
header{display:flex;justify-content:space-between;align-items:flex-start}
h1{margin:0;font-size:28px;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--mute);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;width:44px;height:44px;font-size:20px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5}
.banner button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0;margin-left:6px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{text-align:left;border:2px solid transparent;border-radius:16px;padding:14px;background:var(--panel)}
.card b{display:block;font-size:13px}.card span{display:block;font-size:20px;font-weight:700;margin:4px 0 2px}.card small{color:var(--mute)}
.card.a b{color:var(--a)}.card.b b{color:var(--b)}
.card.a.on{border-color:var(--a);background:var(--a-soft)}.card.b.on{border-color:var(--b);background:var(--b-soft)}
.ring{position:relative;width:min(100%,360px);aspect-ratio:1;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14}
.ring .bg{stroke:var(--line)}
.ring #fg{stroke:var(--a);stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#time{font-size:clamp(52px,17vw,88px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
#status{color:var(--mute);font-size:18px}
body.rest #fg{stroke:var(--b)}
.row{display:flex;gap:12px}
.btn{flex:1;min-height:52px;border:0;border-radius:14px;font-weight:700;font-size:17px;background:var(--a);color:#fff;padding:0 18px}
body.rest .btn.main{background:var(--b)}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:600;font-size:15px;min-height:44px}
.btn.stop{background:var(--panel);color:var(--bad);border:1px solid var(--line)}
.confirm{background:var(--panel);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;text-align:center}
.confirm h2{margin:0;font-size:22px}.confirm p{margin:0;color:var(--mute);line-height:1.5}
.confirm .btn.next{background:var(--b)}.confirm.toB .btn.next{background:var(--b)}.confirm.toA .btn.next{background:var(--a)}
.note{text-align:center;color:var(--mute);font-size:13px;margin:0}
.link{background:none;border:0;color:var(--a);font-size:14px;font-weight:600;padding:8px;align-self:center}
dialog{border:0;border-radius:22px;padding:0;width:min(92vw,460px);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,20,.55)}
form{padding:22px;display:flex;flex-direction:column;gap:16px}
form h2{margin:0;font-size:20px}
fieldset{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0}
legend{font-weight:700;font-size:14px;padding:0 6px}
.dur{display:flex;gap:10px;align-items:center}
.dur label{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:14px}
input[type=number]{width:84px;font:inherit;font-size:18px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4}
.chk input{width:22px;height:22px;margin-top:1px;accent-color:var(--a)}
.chk small{display:block;color:var(--mute);font-size:12px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:0}
.foot{font-size:12px;color:var(--mute);margin:0;line-height:1.5}
@media (prefers-reduced-motion:reduce){.ring #fg{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Focus Cycle</h1><p class="sub">工作与休息，形成节奏</p></div>
    <button class="icon-btn" id="openSet" aria-label="设置">⚙︎</button>
  </header>

  <div class="banner" id="hint" hidden>在 iPad 上安装：点 Safari 的分享按钮，选择“添加到主屏幕”，之后从主屏幕打开使用。<button id="hintClose">知道了</button></div>

  <section class="cards" aria-label="时长设置">
    <button class="card a" id="cardA"><b>A · 专注时间</b><span id="durA"></span><small>可操作设备</small></button>
    <button class="card b" id="cardB"><b>B · 休息时间</b><span id="durB"></span><small>休息阶段</small></button>
  </section>

  <div class="ring" role="timer" aria-live="off">
    <svg viewBox="0 0 300 300"><circle class="bg" cx="150" cy="150" r="130"/><circle id="fg" cx="150" cy="150" r="130" stroke-dasharray="816.8" stroke-dashoffset="816.8"/></svg>
    <div class="center"><div id="time">25:00</div><div id="status">准备开始</div></div>
  </div>

  <div id="controls"></div>
  <p class="note" id="cycles"></p>
  <button class="link" id="notifBtn" hidden>开启通知提醒</button>
</main>

<dialog id="dlg">
  <form method="dialog" id="setForm">
    <h2>设置</h2>
    <fieldset><legend>A · 专注时长</legend><div class="dur">
      <label><input type="number" id="am" min="0" max="180" inputmode="numeric">分</label>
      <label><input type="number" id="as" min="0" max="59" inputmode="numeric">秒</label></div></fieldset>
    <fieldset><legend>B · 休息时长</legend><div class="dur">
      <label><input type="number" id="bm" min="0" max="180" inputmode="numeric">分</label>
      <label><input type="number" id="bs" min="0" max="59" inputmode="numeric">秒</label></div></fieldset>
    <label class="chk"><input type="checkbox" id="snd"><span>应用内提示音<small>阶段结束时在页面内循环播放，直到你确认。</small></span></label>
    <label class="chk"><input type="checkbox" id="wake"><span>计时时保持屏幕常亮<small>网页在后台会被 iPadOS 暂停，常亮能让提醒准时。</small></span></label>
    <p class="err" id="err"></p>
    <p class="foot">时长范围：10 秒到 180 分钟。计时进行中修改，从下一阶段开始生效。</p>
    <div class="row">
      <button type="button" class="btn ghost" id="reset">恢复默认</button>
      <button type="button" class="btn ghost" id="cancel">取消</button>
      <button type="button" class="btn" id="save">保存</button>
    </div>
  </form>
</dialog>

<script>
(function(){
'use strict';
var SK='fc.state.v1',CK='fc.cfg.v1',MIN=10,MAX=10800;
var DEF={a:1500,b:300,sound:true,wake:true};
var $=function(i){return document.getElementById(i)};
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v&&typeof v==='object'?Object.assign({},d,v):d}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var cfg=load(CK,DEF);
if(!(cfg.a>=MIN&&cfg.a<=MAX&&cfg.b>=MIN&&cfg.b<=MAX))cfg=Object.assign({},DEF);
var FRESH={phase:'idle',id:'',deadline:0,remaining:0,dur:0,cycles:0};
var st=load(SK,FRESH);
if(/^run/.test(st.phase)&&!st.deadline)st=Object.assign({},FRESH);
if(/^pause/.test(st.phase)&&!(st.remaining>0))st=Object.assign({},FRESH);
var stopArm=0,timer=null,wakeLock=null,audio=null,alertTimer=null,snoozeAt=0;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function running(){return st.phase==='runA'||st.phase==='runB'}
function paused(){return st.phase==='pauseA'||st.phase==='pauseB'}
function waiting(){return st.phase==='waitA'||st.phase==='waitB'}
function kind(){return /A$/.test(st.phase)?'A':/B$/.test(st.phase)?'B':''}
function persist(){store(SK,st)}
function pad(n){return String(n).padStart(2,'0')}
function fmt(s){s=Math.max(0,Math.ceil(s-1e-9));var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+pad(m):pad(m))+':'+pad(s%60)}
function dtxt(s){var m=Math.floor(s/60),x=s%60;return x===0?m+' 分钟':m===0?x+' 秒':m+' 分 '+x+' 秒'}

/* ---- 状态机 ---- */
function begin(p){
  var d=p==='runA'?cfg.a:cfg.b;
  st.phase=p;st.id=uid();st.dur=d;st.deadline=Date.now()+d*1000;st.remaining=d;
  persist();arm();grabWake();
}
function start(){unlock();if(running()||paused()||waiting())return;st=Object.assign({},FRESH);begin('runA')}
function pause(){refresh();if(!running())return;st.remaining=Math.max(0,(st.deadline-Date.now())/1000);st.phase=kind()==='A'?'pauseA':'pauseB';st.deadline=0;persist();disarm();dropWake();render()}
function resume(){refresh();if(!paused())return;st.deadline=Date.now()+st.remaining*1000;st.phase=kind()==='A'?'runA':'runB';persist();arm();grabWake();render()}
function stop(){
  refresh();if(!(running()||paused()||waiting()))return;
  if(Date.now()>stopArm){            /* 第一次点击只进入确认态，3 秒内再点才停止 */
    stopArm=Date.now()+3000;
    Array.prototype.forEach.call(document.querySelectorAll('[data-act="stop"]'),function(b){b.textContent='再点一次确认停止'});
    setTimeout(function(){$('controls').dataset.sig='';render()},3100);
    return;
  }
  stopArm=0;silence();st.phase='stopped';st.deadline=0;st.remaining=0;persist();disarm();dropWake();render();
}
function confirmNext(from){            /* 只有对应的等待状态才响应，重复点击无效 */
  refresh();
  if(st.phase!==from)return;
  unlock();silence();snoozeAt=0;
  begin(from==='waitA'?'runB':'runA');
}
function snooze(){if(!waiting())return;silence();snoozeAt=Date.now()+300000;render()}
function complete(){
  var wasA=st.phase==='runA',late=(Date.now()-st.deadline)/1000;
  st.phase=wasA?'waitA':'waitB';st.remaining=0;if(wasA)st.cycles++;
  persist();disarm();dropWake();           /* 先持久化，再提醒 */
  if(document.hidden){notify(wasA)}
  else if(late<3){if(cfg.sound)alertStart();if(navigator.vibrate)navigator.vibrate([200,100,200])}
}
function refresh(){
  if(running()){
    var left=(st.deadline-Date.now())/1000;
    if(left<=0)complete();else st.remaining=left;
  }
  if(waiting()&&snoozeAt&&Date.now()>=snoozeAt&&!document.hidden){snoozeAt=0;if(cfg.sound)alertStart()}
  render();
}
function arm(){if(!timer)timer=setInterval(refresh,250)}
function disarm(){if(timer){clearInterval(timer);timer=null}}

/* ---- 提示音（WebAudio 合成，无外部资源） ---- */
function unlock(){
  try{
    if(!audio){var C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C()}
    if(audio&&audio.state==='suspended')audio.resume();
  }catch(e){}
}
function chime(){
  if(!audio)return;var t0=audio.currentTime;
  [[880,0,.5],[1175,.6,.5],[1568,1.2,.9]].forEach(function(n){
    var o=audio.createOscillator(),g=audio.createGain();
    o.frequency.value=n[0];o.type='sine';
    g.gain.setValueAtTime(0,t0+n[1]);g.gain.linearRampToValueAtTime(.5,t0+n[1]+.01);
    g.gain.exponentialRampToValueAtTime(.001,t0+n[1]+n[2]);
    o.connect(g);g.connect(audio.destination);o.start(t0+n[1]);o.stop(t0+n[1]+n[2]+.05);
  });
}
function alertStart(){
  silence();unlock();var n=0;chime();
  alertTimer=setInterval(function(){if(++n>=20){silence();return}chime()},3000);
  render();
}
function silence(){if(alertTimer){clearInterval(alertTimer);alertTimer=null}}

/* ---- 通知与屏幕常亮 ---- */
function notify(wasA){
  try{
    if(window.Notification&&Notification.permission==='granted'){
      new Notification(wasA?'专注时间结束了':'休息时间结束了',{body:wasA?'准备好休息了吗？打开应用确认。':'准备开始新一轮专注吗？打开应用确认。',tag:st.id});
    }
  }catch(e){}
}
function grabWake(){
  if(!cfg.wake||!running()||!navigator.wakeLock)return;
  navigator.wakeLock.request('screen').then(function(l){wakeLock=l;l.addEventListener('release',function(){wakeLock=null})}).catch(function(){});
}
function dropWake(){if(wakeLock){wakeLock.release().catch(function(){});wakeLock=null}}

/* ---- 界面 ---- */
var C=2*Math.PI*130;
function render(){
  var k=kind(),isRest=k==='B';
  document.body.classList.toggle('rest',isRest);
  $('durA').textContent=dtxt(cfg.a);$('durB').textContent=dtxt(cfg.b);
  $('cardA').classList.toggle('on',k==='A');$('cardB').classList.toggle('on',k==='B');
  var secs=(st.phase==='idle'||st.phase==='stopped')?cfg.a:st.remaining;
  var prog=(running()||paused())?Math.min(1,Math.max(0,1-st.remaining/Math.max(1,st.dur))):waiting()?1:0;
  $('time').textContent=fmt(secs);
  $('fg').setAttribute('stroke-dashoffset',String(C*(1-prog)));
  $('status').textContent={idle:'准备开始',stopped:'准备开始',runA:'专注时间 · A',pauseA:'专注已暂停',waitA:'专注时间已结束',runB:'休息时间 · B',pauseB:'休息已暂停',waitB:'休息时间已结束'}[st.phase];
  document.title=(running()||paused()?fmt(secs)+' · ':'')+'Focus Cycle';
  var h='',p=st.phase;
  if(p==='idle'||p==='stopped')h='<button class="btn main" data-act="start">开始循环</button>';
  else if(running())h='<div class="row"><button class="btn main" data-act="pause">暂停</button><button class="btn stop" data-act="stop">停止</button></div>';
  else if(paused())h='<div class="row"><button class="btn main" data-act="resume">继续</button><button class="btn stop" data-act="stop">停止</button></div>';
  else if(waiting()){
    var toB=p==='waitA';
    h='<div class="confirm '+(toB?'toB':'toA')+'"><h2>'+(toB?'专注时间结束':'休息时间结束')+'</h2><p>'+(toB?'你已经完成本轮专注。现在可以休息一下。':'休息结束了。准备好开始新一轮专注吗？')+'</p>'
     +'<button class="btn next" data-act="'+(toB?'toB':'toA')+'">'+(toB?'开始休息 · '+fmt(cfg.b):'开始专注 · '+fmt(cfg.a))+'</button>'
     +'<p class="foot">点击后，'+(toB?'B':'A')+' 阶段才正式开始倒计时。</p>'
     +'<div class="row">'+(alertTimer?'<button class="btn ghost" data-act="mute">关闭提示音</button>':'')+'<button class="btn ghost" data-act="snooze">稍后处理</button><button class="btn ghost" data-act="stop">停止循环</button></div></div>';
  }
  if($('controls').dataset.sig!==h){$('controls').innerHTML=h;$('controls').dataset.sig=h}
  $('cycles').textContent=st.cycles>0&&p!=='idle'?'本次已完成专注 '+st.cycles+' 轮':'';
  var canN=!!window.Notification;
  $('notifBtn').hidden=!canN||Notification.permission!=='default';
}
$('controls').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  ({start:start,pause:pause,resume:resume,stop:stop,mute:function(){silence();render()},snooze:snooze,
    toB:function(){confirmNext('waitA')},toA:function(){confirmNext('waitB')}})[b.dataset.act]();
});
$('notifBtn').onclick=function(){try{Notification.requestPermission().then(render)}catch(e){}};

/* ---- 设置 ---- */
var dlg=$('dlg');
function openSet(){
  $('am').value=Math.floor(cfg.a/60);$('as').value=cfg.a%60;
  $('bm').value=Math.floor(cfg.b/60);$('bs').value=cfg.b%60;
  $('snd').checked=cfg.sound;$('wake').checked=cfg.wake;$('err').textContent='';
  dlg.showModal();
}
function readSet(){
  var n=function(i){var v=$(i).value.trim();return /^\d+$/.test(v)?parseInt(v,10):NaN};
  return {a:n('am')*60+n('as'),b:n('bm')*60+n('bs'),sound:$('snd').checked,wake:$('wake').checked};
}
$('openSet').onclick=openSet;$('cardA').onclick=openSet;$('cardB').onclick=openSet;
$('cancel').onclick=function(){dlg.close()};
$('reset').onclick=function(){$('am').value=25;$('as').value=0;$('bm').value=5;$('bs').value=0;$('snd').checked=true;$('wake').checked=true;$('err').textContent=''};
$('save').onclick=function(){
  var v=readSet();
  if(isNaN(v.a)||isNaN(v.b)){$('err').textContent='请输入有效的数字。';return}
  if(v.a<MIN||v.b<MIN){$('err').textContent='时长不能少于 10 秒。';return}
  if(v.a>MAX||v.b>MAX){$('err').textContent='时长不能超过 180 分钟。';return}
  cfg=v;store(CK,cfg);dlg.close();if(!cfg.wake)dropWake();else grabWake();render();
};

/* ---- 生命周期 ---- */
document.addEventListener('visibilitychange',function(){
  if(document.hidden){silence();return}
  refresh();grabWake();
});
window.addEventListener('pageshow',refresh);

/* 安装提示 */
var standalone=window.navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
var seen=false;try{seen=localStorage.getItem('fc.hint')==='1'}catch(e){}
if(!standalone&&!seen&&/iPad|iPhone|Macintosh/.test(navigator.userAgent)&&'ontouchend' in document)$('hint').hidden=false;
$('hintClose').onclick=function(){$('hint').hidden=true;try{localStorage.setItem('fc.hint','1')}catch(e){}};

refresh();if(running()){arm();grabWake()}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
</html>
